interface:
  display_name: "Figma"
  short_description: "Set up Figma MCP and fetch design context"
  default_prompt: "Use $figma to troubleshoot Figma MCP or fetch the requested design context, screenshots, variables, and assets."

dependencies:
  tools:
    - type: "mcp"
      value: "figma"
      description: "Figma MCP server"
      transport: "streamable_http"
      url: "https://mcp.figma.com/mcp"
