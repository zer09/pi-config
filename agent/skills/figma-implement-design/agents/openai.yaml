interface:
  display_name: "Figma Implement Design"
  short_description: "Implement repository UI from Figma designs"
  default_prompt: "Use $figma-implement-design to implement this Figma node or desktop selection in the repository, matching its look, behavior, and responsive states."

dependencies:
  tools:
    - type: "mcp"
      value: "figma"
      description: "Figma MCP server"
      transport: "streamable_http"
      url: "https://mcp.figma.com/mcp"
